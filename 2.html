  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;transform-origin:0 0;font-family:'Cormorant Garamond','Palatino Linotype',Georgia,serif}
  #stage>*{position:absolute}
  svg{overflow:visible}

  /* latar: potongan tengah artwork (cahaya senja) + vinyet indigo, berlubang untuk gameplay */
  .bg{inset:0;-webkit-mask:url(#hm);mask:url(#hm);background:var(--art) 50% 50%/auto 100% no-repeat,var(--indigo);animation:pan 50s ease-in-out infinite alternate}
  .bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse 70% 40% at 50% 62%,rgba(255,185,130,.28),transparent 70%),
               linear-gradient(180deg,rgba(29,21,55,.7),rgba(59,42,99,.35) 45%,rgba(21,12,40,.88));backdrop-filter:blur(3px)}
  @keyframes pan{from{background-position:42% 50%}to{background-position:58% 50%}}

  /* banner artwork: sudut kelopak */
  .art{left:60px;top:1324px;width:960px;height:536px;overflow:hidden;border-radius:48px 10px 48px 10px}
  .art div,.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--art) center/cover;animation:kb 30s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.05) translate(-8px,-4px)}}
  .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 70%,rgba(29,21,55,.55))}

  .frames{left:0;top:0}
  .march{animation:march 40s linear infinite}
  @keyframes march{to{stroke-dashoffset:-882}}
  .spin{transform-origin:50% 50%;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* sayap transparan di sisi jendela gameplay */
  .wing{top:646px;width:60px;height:600px;animation:flut 6s ease-in-out infinite}
  .wing.l{left:0;transform-origin:100% 50%}
  .wing.r{left:1020px;transform-origin:0 50%;animation-delay:-3s}
  @keyframes flut{0%,100%{transform:scaleX(1);opacity:.75}50%{transform:scaleX(.86);opacity:1}}

  canvas{left:0;top:0;pointer-events:none}

  .live{left:90px;top:1354px;display:flex;align-items:center;gap:10px;padding:6px 22px 6px 14px;border-radius:30px;color:#fff;
    font-size:30px;font-weight:700;letter-spacing:.06em;background:linear-gradient(90deg,var(--rose),var(--coral));box-shadow:0 0 20px rgba(214,40,95,.7)}
  .live i{width:14px;height:14px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 15px rgba(255,255,255,0)}}

  .ribbon{left:150px;top:572px;width:780px;height:84px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)) drop-shadow(0 0 14px rgba(255,122,138,.5));animation:rise 1.2s cubic-bezier(.2,.9,.2,1) both}
  .ribbon span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#fff;font-size:50px;font-weight:700;
    text-shadow:0 2px 6px rgba(80,10,40,.7);background:linear-gradient(180deg,#f0507c,var(--rose) 60%,#a81c4a);
    clip-path:polygon(0 0,100% 0,calc(100% - 34px) 50%,100% 100%,0 100%,34px 50%);border-bottom:4px solid var(--gold)}
  @keyframes rise{from{transform:translateY(40px);opacity:0}}

  /* judul 3D: huruf berputar masuk, bergelombang, dan seluruh teks miring-berayun */
  .t3d{left:0;top:1232px;width:1080px;height:84px;perspective:900px;pointer-events:none}
  #title{display:flex;justify-content:center;align-items:center;height:84px;white-space:nowrap;font-size:64px;font-weight:800;
    letter-spacing:.02em;line-height:1;color:#fff0d8;transform-style:preserve-3d;animation:tilt 7s ease-in-out infinite alternate}
  @keyframes tilt{from{transform:rotateX(14deg) rotateY(-10deg)}to{transform:rotateX(20deg) rotateY(10deg)}}
  #title .w,#name .w{display:inline-block;transform-style:preserve-3d;animation:wavy 2.6s ease-in-out infinite}
  @keyframes wavy{0%,100%{transform:translateY(0) translateZ(0);filter:brightness(1)}50%{transform:translateY(-7px) translateZ(24px);filter:brightness(1.3)}}
  #title .c,#name .c{display:inline-block;animation:inn .8s cubic-bezier(.2,1.5,.4,1) both;
    text-shadow:0 1px 0 #e3b565,0 2px 0 #d49a50,0 3px 0 #c4883f,0 4px 0 #b07535,0 5px 0 #9a2a55,0 6px 0 #861f48,0 7px 0 #6e1838,0 9px 12px rgba(0,0,0,.55),0 0 26px rgba(255,122,138,.65)}
  #title.out .c{animation:outk .5s ease-in both}
  @keyframes inn{from{transform:rotateX(-100deg) translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes outk{to{transform:rotateX(90deg) translateY(-30px) scale(.6);opacity:0}}
  @media (prefers-reduced-motion:reduce){#title,#title .w,#title .c,#name .box,#name .w,#name .c,#tag,.info small{animation:none}}

  .cam{left:80px;top:150px;width:380px;height:380px;box-sizing:border-box;border-radius:50%;border:5px solid var(--gold);
    box-shadow:0 0 0 8px rgba(214,40,95,.35),0 0 34px rgba(255,185,130,.55),inset 0 0 30px rgba(59,42,99,.5)}
  .info{left:490px;top:130px;width:530px;height:420px;box-sizing:border-box;padding:30px 38px;color:#fff;border-radius:60px 10px 60px 10px;
    background:linear-gradient(150deg,rgba(59,42,99,.82),rgba(29,21,55,.86));border:3px solid var(--gold);box-shadow:0 0 30px rgba(255,185,130,.35);
    display:flex;flex-direction:column;justify-content:center;gap:14px}
  .info .nm{font-size:74px;font-weight:700;line-height:1;color:var(--peach);text-shadow:0 0 16px rgba(255,122,138,.6);padding-left:26px}
  .info hr{border:0;height:2px;margin:0 0 0 26px;width:70%;background:linear-gradient(90deg,var(--gold),transparent)}
  #tag{font-size:40px;font-weight:600;line-height:1.1;padding-left:26px;transition:opacity .6s;color:#fff}
  .info small{display:block;transform-origin:0 50%;font-size:32px;font-weight:700;padding-left:26px;color:var(--teal);
    text-shadow:0 1px 0 #2b7f78,0 2px 0 #1f5f5a,0 3px 0 #164a46,0 5px 8px rgba(0,0,0,.5),0 0 16px rgba(159,216,212,.6)}
  #tag{transform-origin:0 50%}
  @keyframes flipOut{to{transform:perspective(600px) rotateX(-90deg);opacity:0}}
  @keyframes flipIn{from{transform:perspective(600px) rotateX(90deg);opacity:0}to{transform:perspective(600px) rotateX(0);opacity:1}}
  .info .nm{perspective:700px}
  #name .box{display:inline-flex;transform-style:preserve-3d;transform-origin:0 50%;animation:tilt2 6s ease-in-out infinite alternate}
  @keyframes tilt2{from{transform:rotateY(-16deg) rotateX(6deg)}to{transform:rotateY(10deg) rotateX(-5deg)}}

  #alert{left:100px;top:706px;width:880px;box-sizing:border-box;padding:18px 28px;text-align:center;color:#fff;font-size:42px;font-weight:700;
    border-radius:60px 12px 60px 12px;border:3px solid var(--gold);background:rgba(29,21,55,.92);box-shadow:0 0 30px rgba(255,185,130,.6);
    transform:translateY(-300px);opacity:0;transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .5s}
  #alert.show{transform:none;opacity:1}

  .bell{bottom:0;width:60px;height:120px;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite;filter:drop-shadow(0 0 12px #7aa8ff)}
  @keyframes sway{50%{transform:rotate(7deg)}}
  @media (prefers-reduced-motion:reduce){.bg,.art div,.march,.spin,.wing,.bell,.live i{animation:none}}
</style>
</head>

<script>
/* ====== EDIT DI SINI (atau lewat URL: ?name=Budi&title=Ranked%20Malam) ====== */
const CONFIG = {
  name:'IDKA',
  subs:['Alice Ft Angela','Main Santai, Seru Bareng','Pemburu Win Streak','Teman Begadang Kamu'],
  titles:['Live Game Bareng IDKA','Mari Main Bareng!','Welcome, Alice Ft Angela!','Ayo Ramaikan Chat!','GG, Semangat Terus!','Jangan Lupa Follow!'],
  tags:['Follow dulu biar nggak ketinggalan!','Tap-tap layar buat semangatin aku!','Tulis komen, aku baca semuanya!','Share ke temen biar makin rame!','Mau request game? Tulis di chat!','Makasih udah mampir, selamat bersenang-senang!'], tagInterval:6000
};
const q = new URLSearchParams(location.search);
if(q.get('name'))  CONFIG.name  = q.get('name');
if(q.get('title')) CONFIG.titles = [q.get('title')];
/* nama 3D */
const nEl=document.getElementById('name'); nEl.innerHTML='';
const nBox=document.createElement('span'); nBox.className='box'; nEl.appendChild(nBox);
[...CONFIG.name].forEach((ch,i)=>{
  const w=document.createElement('span'); w.className='w'; w.style.animationDelay=(i*.15)+'s';
  const c=document.createElement('span'); c.className='c'; c.style.animationDelay=(i*.12)+'s'; c.textContent=ch;
  w.appendChild(c); nBox.appendChild(w);
});
const tEl=document.getElementById('title');
let pi=0;
function showTitle(){
  const s=CONFIG.titles[pi%CONFIG.titles.length]; pi++;
  tEl.classList.remove('out'); tEl.innerHTML='';
  [...s].forEach((ch,i)=>{
    const w=document.createElement('span'); w.className='w'; w.style.animationDelay=(i*.12)+'s';
    const c=document.createElement('span'); c.className='c'; c.style.animationDelay=(i*.045)+'s'; c.textContent=ch===' '?'\u00a0':ch;
    w.appendChild(c); tEl.appendChild(w);
  });
  if(CONFIG.titles.length>1) setTimeout(()=>{ tEl.classList.add('out'); setTimeout(showTitle,900); },5200);
}
showTitle();

/* default transparan. ?preview = latar gelap untuk melihat di browser, ?green = latar hijau untuk chroma key */
if(q.has('preview') || location.hash==='#preview') document.body.style.background='#140a24';
if(q.has('green')) document.body.style.background='#00ff00'; /* untuk Window Capture + chroma key */

const stage=document.getElementById('stage');
function fit(){ stage.style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'; }
addEventListener('resize',fit); fit();

let ti=0; const tagEl=document.getElementById('tag'); tagEl.textContent=CONFIG.tags[0];
const FLIP_IN='flipIn .6s cubic-bezier(.2,1.4,.4,1) both', FLIP_OUT='flipOut .5s ease-in forwards';
setInterval(()=>{ tagEl.style.animation=FLIP_OUT; setTimeout(()=>{ti=(ti+1)%CONFIG.tags.length;tagEl.textContent=CONFIG.tags[ti];tagEl.style.animation=FLIP_IN;},500); },CONFIG.tagInterval);
const subEl=document.getElementById('sub'); let si=0; subEl.textContent=CONFIG.subs[0];
setInterval(()=>{ subEl.style.animation=FLIP_OUT; setTimeout(()=>{si=(si+1)%CONFIG.subs.length;subEl.textContent=CONFIG.subs[si];subEl.style.animation=FLIP_IN;},500); },4500);

const al=document.getElementById('alert');
function showAlert(t){ al.textContent=t; al.classList.add('show'); setTimeout(()=>al.classList.remove('show'),5000); }
window.showAlert=showAlert;
addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='a') showAlert('✿ Pengikut baru: Peri Kecil!'); });

/* partikel: kunang-kunang emas/tosca + kelopak mawar & lavender */
const g=document.getElementById('fx').getContext('2d'), W=1080, H=1920, rnd=(a,b)=>a+Math.random()*(b-a);
const flies=Array.from({length:40},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(2,4.5),s:rnd(.2,.7),p:rnd(0,6.28),h:Math.random()<.2?170:40}));
const petals=Array.from({length:18},()=>({x:rnd(0,W),y:rnd(-H,0),s:rnd(.6,1.5),w:rnd(10,20),a:rnd(0,6.28),v:rnd(.01,.03),c:Math.random()<.6?'#ff6f94':'#cdbcff'}));
function frame(t){
  g.clearRect(0,0,W,H); g.globalCompositeOperation='lighter';
  for(const f of flies){
    f.x+=Math.sin(t/1800+f.p)*f.s; f.y+=Math.cos(t/2300+f.p)*f.s*.6-.12;
    if(f.y<-10)f.y=H+10; if(f.x<-10)f.x=W+10; if(f.x>W+10)f.x=-10;
    const k=.45+.55*Math.sin(t/600+f.p*3), gr=g.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*7);
    gr.addColorStop(0,`hsla(${f.h},100%,75%,${.9*k})`); gr.addColorStop(1,`hsla(${f.h},100%,60%,0)`);
    g.fillStyle=gr; g.beginPath(); g.arc(f.x,f.y,f.r*7,0,6.28); g.fill();
  }
  g.globalCompositeOperation='source-over';
  for(const p of petals){
    p.y+=p.s; p.x+=Math.sin(t/900+p.a)*1.2; p.a+=p.v; if(p.y>H+30){p.y=-30;p.x=rnd(0,W);}
    g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.globalAlpha=.8; g.fillStyle=p.c;
    g.beginPath(); g.ellipse(0,0,p.w*Math.abs(Math.cos(p.a*1.3))*.5+3,p.w*.5,0,0,6.28); g.fill(); g.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
/* Animasi artwork: gambar didistorsi di GPU (sayap mengepak, tubuh melayang, kain berayun) */
(function(){
  const cv=document.getElementById('gl'), gl=cv.getContext('webgl');
  if(!gl) return;
  const m=/url\(["']?(.*?)["']?\)/.exec(getComputedStyle(document.documentElement).getPropertyValue('--art'));
  if(!m) return;
  const vs='attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
  const fs=`precision mediump float;varying vec2 v;uniform sampler2D tex;uniform float t;
  const float A=1.7917;
  float g(vec2 p,vec2 c,vec2 r){vec2 d=(p-c)/r;return exp(-dot(d,d));}
  vec2 rotD(vec2 p,vec2 h,float a){vec2 q=(p-h)*vec2(A,1.);float c=cos(a),s=sin(a);vec2 r=vec2(c*q.x-s*q.y,s*q.x+c*q.y);return (r-q)/vec2(A,1.);}
  void main(){
    vec2 p=v; vec2 D=vec2(0.);
    D+=vec2(sin(t*1.3)*.003,sin(t*1.1)*.016)*g(p,vec2(.36,.55),vec2(.14,.34));
    D+=vec2(sin(t*1.0+2.)*.003,sin(t*1.25+1.)*.014)*g(p,vec2(.64,.42),vec2(.11,.32));
    D+=vec2(sin(t*1.7)*.004,sin(t*1.9)*.02)*g(p,vec2(.17,.40),vec2(.05,.10));
    D+=vec2(sin(t*2.1)*.008,cos(t*2.6)*.012)*g(p,vec2(.52,.30),vec2(.04,.07));
    float a1=sin(t*3.4)*.14;
    D+=rotD(p,vec2(.30,.31),a1)*g(p,vec2(.385,.15),vec2(.09,.16));
    D+=rotD(p,vec2(.29,.33),-a1)*g(p,vec2(.225,.27),vec2(.055,.08));
    D+=rotD(p,vec2(.72,.40),sin(t*1.8)*.06)*g(p,vec2(.87,.25),vec2(.15,.38));
    D+=rotD(p,vec2(.70,.56),sin(t*2.6+1.)*.08)*g(p,vec2(.82,.60),vec2(.13,.20));
    D.x+=sin(p.y*20.-t*2.6)*.004*g(p,vec2(.33,.70),vec2(.10,.20));
    D.x+=sin(p.y*16.-t*2.2+1.)*.005*g(p,vec2(.74,.76),vec2(.13,.18));
    D.x+=sin(p.y*14.-t*2.)*.006*g(p,vec2(.78,.18),vec2(.06,.14));
    vec3 col=texture2D(tex,clamp(p-D,0.,1.)).rgb;
    col+=vec3(1.,.75,.5)*.07*(.5+.5*sin(t*.9))*g(p,vec2(.5,.45),vec2(.2,.3));
    gl_FragColor=vec4(col,1.);
  }`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr); if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const ut=gl.getUniformLocation(pr,'t');
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const img=new Image();
  img.onload=()=>{
    const tx=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.viewport(0,0,cv.width,cv.height);
    (function draw(ms){ gl.uniform1f(ut,still?0:ms/1000); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); if(!still) requestAnimationFrame(draw); })(0);
  };
  img.src=m[1];
})();
</script>
